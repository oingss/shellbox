name: shellbox_flutter
description: "ShellBox - a modern, clean SSH client for Android and Windows. Flutter rewrite."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # ---- Pure Dart SSH + terminal emulation (100% platform-neutral) ----
  dartssh2: ^3.3.1
  xterm: ^4.0.0

  # ---- State management ----
  flutter_riverpod: ^2.6.1
  collection: ^1.18.0

  # ---- Persistence: package:sqlite3 directly on both Android and Windows.
  # Uses sqlite3_flutter_libs to bundle the native sqlite3 library per
  # platform. Deliberately NOT using sqflite/sqflite_common_ffi: that
  # combination pulled package:jni into the dependency graph, which
  # attempts to spawn an actual JVM on desktop targets and is the prime
  # suspect for a silent, no-log Windows startup crash (exit code
  # c000041d, occurring before any Dart code ran). See app_database.dart
  # for the full explanation.
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # ---- Secure storage (Android Keystore / Windows DPAPI) ----
  flutter_secure_storage: ^9.2.2

  # ---- Responsible for secret at-rest encryption: pure Dart AES-GCM ----
  cryptography: ^2.7.0

  # ---- File picking (SAF on Android, native dialog on Windows) ----
  file_picker: ^8.1.4

  # ---- Light preferences (terminal font/size, virtual-key layout) ----
  shared_preferences: ^2.3.2

  # ---- Android: foreground keep-alive + notifications ----
  # flutter_background_service is the endorsed federated plugin; the android
  # implementation (flutter_background_service_android) comes in transitively.
  flutter_background_service: ^5.1.0
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

# Diagnostic guard, not a real version pin: if `flutter pub get` fails
# because of this, the error message will name exactly which package in
# the dependency graph still requires `jni`/`jnigen` — that's the
# remaining culprit to remove or replace. If `pub get` succeeds, it means
# nothing in the current dependency set needs jni anymore, which is what
# we want on Windows (see the note above the `sqlite3` dependency).
# Safe to delete this block once confirmed clean.
dependency_overrides:
  jni: 0.0.1-does-not-exist
  jnigen: 0.0.1-does-not-exist

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
    - family: FiraCode
      fonts:
        - asset: assets/fonts/FiraCode-Regular.ttf
    - family: SourceCodePro
      fonts:
        - asset: assets/fonts/SourceCodePro-Regular.ttf